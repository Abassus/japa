site_name: Japa Gateway
site_description: A cloud-native API Gateway built with Bun
site_url: https://your-username.github.io/japa-gateway/
repo_url: https://github.com/your-username/japa-gateway
repo_name: your-username/japa-gateway

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - social

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Overview: user-guide/overview.md
    - Basic Gateway Setup: user-guide/basic-gateway.md
    - Advanced Routing: user-guide/advanced-routing.md
    - Authentication Strategies: user-guide/authentication.md
    - Traffic Management: user-guide/traffic-management.md
    - Microfrontends: user-guide/microfrontends.md
    - Security Best Practices: user-guide/security.md
    - Monitoring & Observability: user-guide/monitoring.md
    - Troubleshooting: user-guide/troubleshooting.md
  - Features:
    - Routing: features/routing.md
    - Authentication: features/authentication.md
    - Rate Limiting: features/rate-limiting.md
    - Circuit Breaking: features/circuit-breaking.md
    - CORS: features/cors.md
  - Deployment:
    - Docker: deployment/docker.md
    - Kubernetes: deployment/kubernetes.md
    - Environment Variables: deployment/environment-variables.md
  - API Reference:
    - Configuration Schema: api-reference/configuration-schema.md
    - Plugin System: api-reference/plugin-system.md
  - Contributing:
    - Development Guide: contributing/development-guide.md
    - Code of Conduct: contributing/code-of-conduct.md
  - Changelog: changelog.md
