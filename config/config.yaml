# Japa Gateway Configuration

# Server configuration
server:
  # Use environment variables with defaults using the ${VAR_NAME:-default} syntax
  port: ${GATEWAY_PORT:-8000}
  host: ${GATEWAY_HOST:-"0.0.0.0"}
  timeout: ${GATEWAY_TIMEOUT:-30000}
  trustProxy: ${GATEWAY_TRUST_PROXY:-false}

# Routes configuration
routes:
  # Example API route
  - path: "/api/*"
    methods: ["GET", "POST", "PUT", "DELETE"]
    target: "${API_SERVICE_URL:-http://api-service:3000}"
    plugins:
      cors:
        origins: ["example.com", "api.example.com"]
      rateLimit:
        limit: 100
        window: 60
  
  # Example public route
  - path: "/public/*"
    target: "${PUBLIC_SERVICE_URL:-http://public-service:3000}"
    plugins:
      cors:
        origins: ["*"]
        methods: ["GET", "OPTIONS"]
  
  # Example admin route with API key auth
  - path: "/admin/*"
    target: "${ADMIN_SERVICE_URL:-http://admin-service:3000}"
    plugins:
      auth:
        method: "apiKey"
        apiKey:
          keys: ["${ADMIN_API_KEY}"]
      rateLimit:
        limit: 50
        window: 60

# Plugin configurations
plugins:
  # Authentication plugin
  auth:
    method: ${AUTH_METHOD:-"none"}  # Default: no authentication
    # Example JWT configuration with environment variables
    jwt:
      secret: ${JWT_SECRET:-""}
      issuer: ${JWT_ISSUER:-"japa-gateway"}
      audience: ${JWT_AUDIENCE:-"japa-clients"}
      expiresIn: ${JWT_EXPIRES_IN:-"1h"}
  
  # Rate limiting plugin
  rateLimit:
    enabled: ${RATE_LIMIT_ENABLED:-true}
    algorithm: ${RATE_LIMIT_ALGORITHM:-"fixed-window"}
    limit: ${RATE_LIMIT_MAX:-1000}
    window: ${RATE_LIMIT_WINDOW:-60}
    identifierKey: ${RATE_LIMIT_IDENTIFIER:-"ip"}
    headers: ${RATE_LIMIT_HEADERS:-true}
  
  # CORS plugin
  cors:
    enabled: ${CORS_ENABLED:-true}
    # For arrays, you can use comma-separated values in the environment variable
    # which will be parsed by the resolveEnvVars function
    origins: ${CORS_ORIGINS:-["*"]}
    methods: ${CORS_METHODS:-["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]}
    allowedHeaders: ${CORS_ALLOWED_HEADERS:-["Content-Type", "Authorization", "X-Requested-With"]}
    exposedHeaders: ${CORS_EXPOSED_HEADERS:-["Content-Length", "X-RateLimit-Limit", "X-RateLimit-Remaining", "X-RateLimit-Reset"]}
    allowCredentials: false
    maxAge: 86400
    handlePreflight: true
  
  # Circuit breaker plugin
  circuitBreaker:
    enabled: true
    failureThreshold: 0.5  # 50% failure rate
    successThreshold: 2
    resetTimeout: 30000
    windowSize: 10
    trackByRoute: true

# Telemetry configuration
telemetry:
  enabled: true
  metrics: true
  tracing: true
  logging:
    level: "info"
    format: "json"
